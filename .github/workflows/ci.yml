name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal default permissions; individual jobs request only what they need.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Note: GitHub Actions execution is not verified locally until pushed to GitHub.
  repo-governance:
    name: Repo Structure, Adapters & Generator Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: "22"

      - name: Detect blueprint repository layout
        id: layout
        run: |
          if [ -f "scripts/sync-adapters.mjs" ] && [ -d "templates/fullstack" ]; then
            echo "is_blueprint=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_blueprint=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run environment doctor
        if: steps.layout.outputs.is_blueprint == 'true'
        run: npm run doctor

      - name: Check cross-tool adapter synchronization
        if: steps.layout.outputs.is_blueprint == 'true'
        run: npm run check:adapters

      - name: Run repository structure, adapter, and generator smoke tests
        if: steps.layout.outputs.is_blueprint == 'true'
        run: npm run test:repo

      - name: Verify create-project.mjs clean temp dir scaffold
        if: steps.layout.outputs.is_blueprint == 'true'
        run: |
          SMOKE_DIR="${{ runner.temp }}/ci-smoke-app"
          rm -rf "$SMOKE_DIR"
          node scripts/create-project.mjs --name ci-smoke-app --target "$SMOKE_DIR"
          test -f "$SMOKE_DIR/.blueprint-manifest.json"
          test -f "$SMOKE_DIR/AGENTS.md"
          test -f "$SMOKE_DIR/standards/security.md"
          test ! -e "$SMOKE_DIR/node_modules"
          test ! -e "$SMOKE_DIR/.env"
          rm -rf "$SMOKE_DIR"

  fullstack-ci:
    name: App Lint, Typecheck, Tests (PGlite + Postgres), Build & E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pusula
          POSTGRES_PASSWORD: pusula_local_only
          POSTGRES_DB: pusula_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pusula -d pusula_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve application root directory
        id: app
        run: |
          if [ -f "templates/fullstack/package.json" ]; then
            echo "dir=templates/fullstack" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "${{ steps.app.outputs.dir }}/package-lock.json"

      - name: Frozen dependency install (npm ci)
        working-directory: ${{ steps.app.outputs.dir }}
        run: npm ci

      - name: Dependency vulnerability check (npm audit)
        working-directory: ${{ steps.app.outputs.dir }}
        run: npm audit --audit-level=high

      - name: Lint
        working-directory: ${{ steps.app.outputs.dir }}
        run: npm run lint

      - name: Typecheck
        working-directory: ${{ steps.app.outputs.dir }}
        run: npm run typecheck

      - name: Vitest integration tests (embedded PGlite mode)
        working-directory: ${{ steps.app.outputs.dir }}
        env:
          NODE_ENV: test
          APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          TRUSTED_ORIGINS: http://127.0.0.1:3000
          TEST_DATABASE_URL: pglite://memory
          SESSION_SECRET: ci-workflow-verification-signing-key-2026-not-for-prod-use
        run: npm test

      - name: Apply Drizzle migrations (PostgreSQL 16 service container)
        working-directory: ${{ steps.app.outputs.dir }}
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://pusula:pusula_local_only@127.0.0.1:5432/pusula_test
          SESSION_SECRET: ci-workflow-verification-signing-key-2026-not-for-prod-use
        run: npm run db:migrate

      - name: Vitest integration tests (PostgreSQL 16 service container)
        working-directory: ${{ steps.app.outputs.dir }}
        env:
          NODE_ENV: test
          APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          TRUSTED_ORIGINS: http://127.0.0.1:3000
          # Keep DATABASE_URL unset here so assertSafeTestDatabaseTarget confirms TEST_DATABASE_URL isolation.
          TEST_DATABASE_URL: postgresql://pusula:pusula_local_only@127.0.0.1:5432/pusula_test
          SESSION_SECRET: ci-workflow-verification-signing-key-2026-not-for-prod-use
        run: npm test

      - name: Production Next.js build
        working-directory: ${{ steps.app.outputs.dir }}
        env:
          NODE_ENV: production
          APP_URL: https://example.invalid
          NEXT_PUBLIC_APP_URL: https://example.invalid
          TRUSTED_ORIGINS: https://example.invalid
          TRUST_PROXY: none
          RATE_LIMIT_DRIVER: postgres
          DATABASE_URL: postgresql://pusula:pusula_local_only@127.0.0.1:5432/pusula_test
          SESSION_SECRET: ci-workflow-verification-signing-key-2026-not-for-prod-use
        run: npm run build

      - name: Install Playwright Chromium browser
        working-directory: ${{ steps.app.outputs.dir }}
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E + @axe-core/playwright tests
        working-directory: ${{ steps.app.outputs.dir }}
        env:
          NODE_ENV: test
          APP_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
          TRUSTED_ORIGINS: http://127.0.0.1:3100
          TEST_DATABASE_URL: postgresql://pusula:pusula_local_only@127.0.0.1:5432/pusula_test
          SESSION_SECRET: ci-workflow-verification-signing-key-2026-not-for-prod-use
        run: npm run test:e2e

      - name: Upload Playwright reports on failure
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: playwright-report
          path: |
            ${{ steps.app.outputs.dir }}/playwright-report
            ${{ steps.app.outputs.dir }}/test-results
          retention-days: 7

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    # Safe for fork PRs: uses pull_request with read-only scopes only (never elevated target triggers).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history for Gitleaks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          # Automatic read-only token on fork PRs; never pass sensitive secrets to fork PR workflows.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  codeql:
    name: CodeQL SAST (JavaScript / TypeScript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
        with:
          category: "/language:javascript-typescript"
